<div class="card-auth">
  <div class="brand-mark">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/>
      <line x1="4.93" y1="4.93" x2="9.17" y2="9.17"/>
      <line x1="14.83" y1="14.83" x2="19.07" y2="19.07"/>
      <line x1="14.83" y1="9.17" x2="19.07" y2="4.93"/>
      <line x1="4.93"  y1="19.07" x2="9.17" y2="14.83"/>
    </svg>
  </div>

  <h1>Entrar</h1>
  <p class="sub">Radar de Arboviroses · acesso ao painel</p>

  @if (erro()) {
    <div class="alert-err">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      {{ erro() }}
    </div>
  }

  <form (ngSubmit)="submit()" #f="ngForm">
    <div class="field">
      <label for="email">E-mail</label>
      <div class="input-wrap">
        <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        <input id="email" type="email" name="email" [(ngModel)]="email"
               placeholder="seu@email.com" required autocomplete="email" />
      </div>
    </div>
    <div class="field">
      <label for="pwd">Senha</label>
      <div class="input-wrap">
        <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input id="pwd" type="password" name="password" [(ngModel)]="password"
               placeholder="••••••••" required autocomplete="current-password" />
      </div>
    </div>

    <button type="submit" class="btn-primary" [disabled]="loading()">
      @if (loading()) { <span class="spinner"></span> Verificando… } @else { Entrar }
    </button>
  </form>

  <div class="divider"><span>ou</span></div>

  <!-- OAuth2 — interface presente, funcionalidade em desenvolvimento -->
  <button class="btn-google" disabled title="Em breve">
    <svg width="17" height="17" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4" opacity=".45"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853" opacity=".45"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05" opacity=".45"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335" opacity=".45"/>
    </svg>
    Continuar com Google
    <span class="badge-soon">Em breve</span>
  </button>

  <p class="switch-link">
    Não tem conta? <a routerLink="/auth/register">Criar conta grátis</a>
  </p>

  <p class="guest-link">
    Ou <a routerLink="/app/dashboard">explore sem conta →</a>
    <span class="guest-note">(sem alertas e perfil)</span>
  </p>
</div>
