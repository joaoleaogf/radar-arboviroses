services:
  # Ativa com: docker compose --profile db up -d
  # (em produção o Postgres roda numa VM dedicada — ver README "Operações")
  db:
    profiles: ["db"]
    image: postgis/postgis:16-3.4
    container_name: radar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar}
      POSTGRES_DB: ${POSTGRES_DB:-radar}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radar} -d ${POSTGRES_DB:-radar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:1.123.55
    container_name: radar-n8n
    restart: unless-stopped
    environment:
      N8N_PORT: 5678
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      # Persistência do próprio n8n no mesmo Postgres (schema separado)
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: ${DB_HOST:-db}
      DB_POSTGRESDB_PORT: ${DB_PORT:-5432}
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-radar}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-radar}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-radar}
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      # Enxuga o histórico de execução — ele vive no MESMO Postgres da API (schema n8n).
      # Não guardar execuções de sucesso corta drasticamente escrita/IO durante o ETL (milhares de itens/terça).
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: "none"
      EXECUTIONS_DATA_SAVE_ON_ERROR: "all"
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"          # descarta execuções com mais de 7 dias
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "5000"
      # Webhooks da API do dashboard (CORS liberado para dev local)
      N8N_CORS_ALLOW_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
      # Usado pelo WF3 (alertas) via $env
      TELEGRAM_ALERT_CHAT_ID: ${TELEGRAM_ALERT_CHAT_ID:-}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
      - ./n8n/credentials:/credentials:ro
    ports:
      - "5678:5678"

  auth-api:
    build:
      context: ./auth-api
      dockerfile: Dockerfile
    container_name: radar-auth
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar}@${DB_HOST:-db}:${DB_PORT:-5432}/${POSTGRES_DB:-radar}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (openssl rand -hex 32)}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:3001}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?defina INTERNAL_SECRET no .env (openssl rand -hex 32)}
      DASHBOARD_URL: ${FRONTEND_URL:-http://localhost:4200}
      NODE_ENV: production
    ports:
      - "3001:3001"

volumes:
  db-data:
  n8n-data:
