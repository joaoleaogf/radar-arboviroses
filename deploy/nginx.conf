# Nginx reverse proxy para o Oracle VM
# Substitua joaoleao.fun pelo seu domínio real antes de usar.
# Certbot vai preencher os blocos SSL automaticamente.

# ── auth-api ──────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.joaoleao.fun;

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# ── n8n (webhooks + UI) ────────────────────────────────────────────────────────
server {
    listen 80;
    server_name n8n.joaoleao.fun;

    # Aumenta timeout para execuções longas de workflows
    proxy_read_timeout    300s;
    proxy_connect_timeout 75s;

    location / {
        proxy_pass         http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # WebSocket (n8n editor usa WS)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
